[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "actenon-blastradius"
version = "0.4.0"
description = "A deterministic guard between AI agents and the shell. Refuses destructive filesystem commands whose resolved target falls outside a declared scope."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Actenon" }]
keywords = ["security", "ai-agents", "shell", "guard", "filesystem", "rm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
blastradius = "blastradius.cli:main"

[tool.setuptools]
packages = ["blastradius"]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]
